<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Registered Users | Twende Events Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
<script src="config.js"></script></head>
<body class="admin-dashboard-page">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="index.html" aria-label="Twende Events home">
        <span class="admin-brand-icon" aria-hidden="true">▣</span>
        <span>twende<span>events</span></span>
      </a>
      <p class="admin-portal-label">ORGANIZER PORTAL</p>

      <nav class="admin-sidebar-nav" aria-label="Organizer navigation">
        <a class="admin-nav-link" href="dashboard.html">
          <span aria-hidden="true">⌂</span> Overview
        </a>
        <a class="admin-nav-link" href="dashboard.html#recent-events">
          <span aria-hidden="true">▤</span> My Events
        </a>
        <a class="admin-nav-link is-active" href="admin-users.html" aria-current="page">
          <span aria-hidden="true">♙</span> Users
        </a>
        <a class="admin-nav-link" href="scanner.html">
          <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="7" y="7" width="10" height="10"></rect></svg></span> Gate Scanner
        </a>
        <a class="admin-nav-link admin-nav-create" href="create-event.html">
          <span aria-hidden="true">＋</span> Create Event
        </a>
      </nav>

      <a class="admin-back-link" href="index.html">← Back to Twende Events</a>
    </aside>

    <main class="admin-main">
      <header class="admin-top-header">
        <div>
          <p class="admin-eyebrow">ORGANIZER PORTAL</p>
          <h1>Registered Users</h1>
        </div>
        <div class="admin-user-chip" aria-label="Signed in as Admin">
          <span class="admin-user-avatar" aria-hidden="true">A</span>
          <span>Admin</span>
        </div>
      </header>

      <section class="admin-events-panel admin-users-panel" aria-labelledby="registered-users-title">
        <div class="admin-section-heading admin-events-heading">
          <div>
            <p class="admin-eyebrow">ACCOUNT MANAGEMENT</p>
            <h2 id="registered-users-title">Registered Users</h2>
          </div>
          <span class="admin-users-caption">Platform accounts</span>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-events-table admin-users-table">
            <thead>
              <tr>
                <th scope="col">User ID</th>
                <th scope="col">Full Name</th>
                <th scope="col">Email</th>
                <th scope="col">Phone Number</th>
                <th scope="col">Role</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body" aria-live="polite">
              <tr><td class="admin-table-message" colspan="6">Loading registered users…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
